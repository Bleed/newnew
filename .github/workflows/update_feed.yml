# Every 30 minutes: checks the RSS feeds, publishes outlets.json (the outlets and their feeds,
# which each iPhone reads itself), status.json and privacy.html to GitHub Pages, and sends
# breaking-news pushes. No news is published.
#
# One-time setup: Settings → Pages → Source: "GitHub Actions". Pages is free for public repos.
# Breaking-news pushes (optional): repository variable CLOUDKIT_CONTAINER, secrets
# CLOUDKIT_KEY_ID and CLOUDKIT_PRIVATE_KEY (a CloudKit server-to-server key). Without them the
# run only logs which stories it would push.
# GitHub pauses scheduled workflows in repos with no activity for 60 days; re-enable it under
# Actions if the outlet list or breaking pushes stop.
name: Update feed

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["github-scraper/**", ".github/workflows/update_feed.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: github-scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: github-scraper/package-lock.json

      - run: npm ci

      - name: Poll feeds
        env:
          # The stories already pushed, so none is pushed twice.
          PREVIOUS_ALERTS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/alerts.json
          CLOUDKIT_CONTAINER: ${{ vars.CLOUDKIT_CONTAINER }}
          CLOUDKIT_ENVIRONMENT: ${{ vars.CLOUDKIT_ENVIRONMENT }}
          CLOUDKIT_KEY_ID: ${{ secrets.CLOUDKIT_KEY_ID }}
          CLOUDKIT_PRIVATE_KEY: ${{ secrets.CLOUDKIT_PRIVATE_KEY }}
        run: node scripts/poll_feeds.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-scraper/public

  deploy:
    needs: poll
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
