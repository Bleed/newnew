name: Newnew
options:
  bundleIdPrefix: com.svein.newnew
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "33"
    CODE_SIGN_STYLE: Automatic
    # The published latest_news.json (GitHub Pages, from .github/workflows/update_feed.yml).
    # Empty: the app uses its bundled sample instead.
    NEWNEW_FEED_URL: "https://bleed.github.io/newnew/index.json"
    # The CloudKit container for breaking-news pushes, e.g. iCloud.com.svein.newnew. Empty: no
    # push; breaking alerts come from background refresh. Set it together with
    # NEWNEW_ENTITLEMENTS = Newnew/App/Newnew-CloudKit.entitlements.
    NEWNEW_CLOUDKIT_CONTAINER: iCloud.com.svein.newnew
    NEWNEW_ENTITLEMENTS: Newnew/App/Newnew-CloudKit.entitlements
    DEVELOPMENT_TEAM: W533Y4V578
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  Newnew:
    type: application
    platform: iOS
    sources: [Newnew]
    settings:
      base:
        PRODUCT_NAME: Newnew
        PRODUCT_BUNDLE_IDENTIFIER: com.svein.newnew
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: newnew
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: $(NEWNEW_ENTITLEMENTS)
    info:
      path: Newnew/App/Info.plist
      properties:
        NewnewFeedURL: $(NEWNEW_FEED_URL)
        NewnewCloudKitContainer: $(NEWNEW_CLOUDKIT_CONTAINER)
        # Background refresh (local alerts) and pushes (breaking news) wake the app to sync;
        # podcast episodes keep playing in the background.
        UIBackgroundModes: [fetch, remote-notification, audio]
        BGTaskSchedulerPermittedIdentifiers: [com.svein.newnew.refresh]
        # ProMotion: scrolling at up to 120 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
schemes:
  Newnew:
    build:
      targets: { Newnew: all }
    run: { config: Debug }
